name: status-check
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check && npm run build
      - run: |
          git config user.name yozum-bot && git config user.email bot@users.noreply.github.com
          git add data/status.json data/status.js places sitemap.xml
          git diff --cached --quiet || git commit -m "status $(date -u +%FT%H:%MZ)" && git push
