<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css"><meta name="description" content="브랜드·기관·지자체를 위한 온라인 장소 제작 문의. 유행하는 3D 온라인 공간을 2~3주에 만듭니다."><title>공간 제작 문의 · 요즘장소</title></head><body><div class="phone">
<header class="top"><div class="brand">공간 제작 문의 <small>브랜드·기관</small></div></header>
<main><section>
<p class="hint">산사·온라인 찜질방처럼 브라우저에서 바로 들어가는 3D 온라인 장소를 브랜드·기관·지자체용으로 만듭니다. 설치 없음, 2~3주. 어떤 공간을 상상하시는지 적어 주시면 하루 안에 메일로 답합니다.</p>
<form id="qf">
<div class="f"><label>기관·브랜드</label><input name="org" required placeholder="예: ○○시 관광과, ○○스파"></div>
<div class="f"><label>담당자</label><input name="person" required></div>
<div class="f"><label>이메일</label><input name="email" type="email" required></div>
<div class="f"><label>만들고 싶은 공간 (한 줄)</label><input name="what" required maxlength="120" placeholder="예: 우리 둘레길을 걷는 온라인 공간"></div>
<div class="f"><label>일정·예산 (선택)</label><input name="budget" placeholder="예: 12월 안에, 예산 미정"></div>
<div class="f"><label>더 하실 말씀 (선택)</label><textarea name="memo"></textarea></div>
<label class="check"><input type="checkbox" required><span>문의 응답을 위해 이메일을 보관하는 데 동의합니다(개인정보처리방침).</span></label>
<button class="btn primary block" type="submit">문의 보내기</button>
</form><div id="qo"></div>
</section></main>
<footer class="foot">요즘장소는 링크와 우리가 쓴 소개만 싣습니다. 원본의 글·이미지·장소 목록을 복사하지 않고, 화면을 iframe 으로 끼워 넣지 않습니다.<br><a href="wishes.html">이런 장소 있었으면</a> · <a href="submit.html">내 장소 등록하기</a> · <a href="inquire.html">공간 제작 문의</a><br><a href="lineage.html">유행의 흐름</a> · <a href="remove.html">내려 주세요</a> · <a href="privacy.html">개인정보처리방침</a></footer><nav class="tabbar" id="tabbar"></nav><script src="data/config.js"></script><script src="data/places.js"></script><script src="data/status.js"></script><script src="assets/icons.js"></script><script src="assets/app.js"></script>
<script>
const EP=(globalThis.CONFIG&&CONFIG.SUBMIT_ENDPOINT)||"";
document.getElementById("qf").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());o.kind="inquiry";o.submittedAt=new Date().toISOString();const out=document.getElementById("qo");
 if(EP){try{await fetch(EP,{method:"POST",mode:"no-cors",body:JSON.stringify(o)});out.innerHTML='<div class="notice">받았습니다. 하루 안에 메일로 답드릴게요.</div>';e.target.reset();}catch{out.innerHTML='<div class="notice">전송 실패. 잠시 뒤 다시 시도해 주세요.</div>';}}
 else out.innerHTML='<div class="notice">시트 연결 전 미리보기입니다. 아래 내용이 접수됩니다.</div><pre class="out">'+JSON.stringify(o,null,1).replace(/</g,"&lt;")+'</pre>';return false;};
</script></body></html>
