<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css">
<title>내 장소 등록하기 · 요즘장소</title></head><body><div class="phone">
<header class="top"><div class="brand">내 장소 등록하기 <small>온라인 장소</small></div></header>
<main><section>
<p class="hint">접속 가능한지 등록할 때 확인합니다. 썸네일은 원본 og:image 를 그대로 불러오고 저장하지 않습니다. 검수 뒤 게시되며 배지 이미지를 드립니다.</p>
<form id="f" onsubmit="return submitPlace(event)">
<div class="f"><label>주소 URL</label><input name="url" type="url" required placeholder="https://"></div>
<div class="f"><label>이름</label><input name="name" required placeholder="예: 산사"></div>
<div class="f"><label>종류</label><select name="type"><option>절<option>찜질방<option>사우나<option>성당<option>교회<option>캠핑장<option>모닥불<option>산<option>카페<option>기타</select></div>
<div class="f"><label>할 수 있는 것 (3~4개)</label><div class="toggles" id="acts"></div></div>
<div class="f"><label>말하기</label><div class="toggles"><label><input type="radio" name="talk" value="없음" checked><span>없음</span></label><label><input type="radio" name="talk" value="채팅"><span>채팅</span></label><label><input type="radio" name="talk" value="음성"><span>음성</span></label></div></div>
<div class="f"><label>개방 시간</label><input name="hours" placeholder="예: 24시간 / 한증막은 22시만"></div>
<div class="f"><label>기기</label><div class="toggles"><label><input type="checkbox" name="dev" value="PC" checked><span>PC</span></label><label><input type="checkbox" name="dev" value="모바일" checked><span>모바일</span></label></div></div>
<div class="f"><label>만든 사람 (@계정)</label><input name="maker" placeholder="@"></div>
<div class="f"><label>한 줄 소개 (우리가 다듬어 올립니다)</label><textarea name="intro" placeholder="어떤 공간이고 무엇을 하는 곳인지"></textarea></div>
<div class="f"><label>연락 이메일 (검수·배지 발송용, 공개 안 함)</label><input name="email" type="email"></div>
<label class="check"><input type="checkbox" required><span>내가 만든 공간이거나 등록 권한이 있습니다. 요즘장소가 링크·소개를 게시하고 등록·갱신 때 접속을 확인해도 됩니다. 언제든 「내려 주세요」로 내릴 수 있습니다.</span></label>
<button class="btn primary block" type="submit">등록 신청</button>
</form>
<div id="out"></div>
</section></main>
<footer class="foot">요즘장소는 링크와 우리가 쓴 소개만 싣습니다. 원본의 글·이미지·장소 목록을 복사하지 않고, 화면을 iframe 으로 끼워 넣지 않습니다.<br><a href="lineage.html">유행의 흐름</a> · <a href="remove.html">내려 주세요</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="submit.html">내 장소 등록하기</a></footer>
<nav class="tabbar" id="tabbar"></nav><script src="data/config.js"></script><script src="data/places.js"></script><script src="data/status.js"></script><script src="assets/icons.js"></script><script src="assets/app.js"></script>
<script>
// 시트 연결 전: Apps Script 웹앱 URL 을 SUBMIT_ENDPOINT 에 넣으면 POST 로 보냅니다. 비어 있으면 JSON 을 화면에 보여 줍니다.
const SUBMIT_ENDPOINT = (globalThis.CONFIG && CONFIG.SUBMIT_ENDPOINT) || "";
document.getElementById("acts").innerHTML = "절하기 앉기 눕기 인사 물붓기 염주 촛불 걷기 불멍 기도 사진찍기".split(" ").map(a => '<label><input type="checkbox" name="act" value="' + a + '"><span>' + a + '</span></label>').join("");
async function submitPlace(e) {
  e.preventDefault();
  const fd = new FormData(e.target); const o = {};
  for (const [k, v] of fd.entries()) { if (k === "act" || k === "dev") (o[k] ||= []).push(v); else o[k] = v; }
  o.kind = "submit"; o.submittedAt = new Date().toISOString();
  const out = document.getElementById("out");
  if (SUBMIT_ENDPOINT) {
    try { await fetch(SUBMIT_ENDPOINT, { method: "POST", mode: "no-cors", body: JSON.stringify(o) }); out.innerHTML = '<div class="notice">접수됐습니다. 접속 확인 뒤 보통 하루 안에 올라갑니다.</div>'; }
    catch { out.innerHTML = '<div class="notice">전송에 실패했어요. 잠시 뒤 다시 시도해 주세요.</div>'; }
  } else {
    out.innerHTML = '<div class="notice">시트 연결 전 미리보기입니다. 아래 내용이 접수됩니다.</div><pre class="out">' + JSON.stringify(o, null, 1).replace(/</g, "&lt;") + '</pre>';
  }
  return false;
}
</script></body></html>
